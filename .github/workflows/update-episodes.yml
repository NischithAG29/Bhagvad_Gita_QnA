name: Check for new episodes

on:
  schedule:
    - cron: "30 1 * * 1"      # every Monday, 7:00 am India time
  workflow_dispatch:           # also allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade yt-dlp
      - name: Download captions for new episodes
        id: ingest
        run: python ingest.py
        continue-on-error: true
      - name: Save new episodes (Vercel then rebuilds the site)
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "No new episodes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add new episode transcripts"
            git push
          fi
      - name: Report a failed download
        if: steps.ingest.outcome == 'failure'
        run: |
          echo "::error::Some new episodes could not be downloaded. YouTube often blocks GitHub's servers; run update.bat on your PC instead."
          exit 1
